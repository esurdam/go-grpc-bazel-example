apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld-deployment
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: helloworld
  template:
    metadata:
      labels:
        app: helloworld
      annotations:
        # prometheus annotations by default
        prometheus.io/port: '10824'
        prometheus.io/scrape: 'true'
    spec:
      imagePullSecrets:
        - name: dockerconfigjson-github-com
      containers:
        - name: helloworld-container
          # Image name only; `make deploy` pins this to an immutable @sha256
          # digest via the generated Kustomize overlay (deploy/helloworld/overlays/live).
          image: ghcr.io/esurdam/go-grpc-bazel-example/services/helloworld:latest
          ports:
            - containerPort: 443
          # Safe to skip re-pulling: we deploy by immutable digest, so the
          # reference can never point at different content.
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          # should contain a healthcheck path & port; excluded for brevity in this repo
          livenessProbe:
            httpGet:
              path: /swagger.json
              port: 443
          readinessProbe:
            httpGet:
              path: /swagger.json
              port: 443
          env:
            - name: ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
