apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld-deployment
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: helloworld
  template:
    metadata:
      labels:
        app: helloworld
    spec:
      imagePullSecrets:
        - name: dockerconfigjson-github-com
      containers:
        - name: helloworld-container
          # Image name only; `make deploy` pins this to an immutable @sha256
          # digest via the generated Kustomize overlay (deploy/helloworld/overlays/live).
          image: ghcr.io/esurdam/go-grpc-bazel-example/services/helloworld:latest
          ports:
            - name: mux
              containerPort: 443
          # Safe to skip re-pulling: we deploy by immutable digest, so the
          # reference can never point at different content.
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: mux
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: mux
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SSL_CERT_PATH
              value: /etc/tls/tls.crt
            - name: SSL_KEY_PATH
              value: /etc/tls/tls.key
            - name: SSL_CA_CERT_PATH
              value: /etc/tls/tls.crt
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
      volumes:
        # Create before deploy, e.g.:
        #   kubectl create secret tls helloworld-tls \
        #     --cert=ssl/cert.pem --key=ssl/key.pem
        - name: tls
          secret:
            secretName: helloworld-tls
